# Shared by ALL services that read their config from the config server
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true
  tracing:
    sampling:
      probability: 1.0          # trace 100% of requests (dev)
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  pattern:
    # Shows [service, traceId, spanId] in every log line
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
