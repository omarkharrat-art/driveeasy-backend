server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    # "git"    -> reads config-repo/ from GitHub (final / grading mode)
    # "native" -> reads config-repo/ from the local disk (handy while developing)
    active: ${CONFIG_PROFILE:git}
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI:https://github.com/omarkharrat-art/driveeasy-backend}
          search-paths: config-repo
          default-label: main
          clone-on-start: true
          # Seconds; the 5 s default is too short for the first clone and crashes the server
          timeout: 30
        native:
          # Path relative to the folder you start the config server from
          search-locations: ${CONFIG_NATIVE_PATH:file:../config-repo/}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
